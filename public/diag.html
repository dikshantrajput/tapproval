<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tapproval - push diagnostics</title>
<!--
  Deliberately no <link rel="manifest">. The app manifest sets start_url "/", so
  linking it would make "Add to Home Screen" from this page launch the real app
  instead of this one. Without a manifest iOS uses the current URL as the launch
  URL, and this meta is what still gets it a standalone (installed) context —
  which is the only context in which iOS will issue a push subscription at all.
-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 18px 16px 40px;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #111318; color: #e7e9ee;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { color: #8b90a0; font-size: 12.5px; margin: 0 0 18px; }
  .row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #23262f; align-items: baseline; }
  .k { flex: none; width: 46%; color: #8b90a0; }
  .v { flex: 1; word-break: break-all; }
  .ok { color: #4ade80; }
  .no { color: #f87171; }
  .warn { color: #fbbf24; }
  button {
    margin-top: 18px; width: 100%; padding: 13px; font: inherit; font-weight: 600;
    background: #2f6df6; color: #fff; border: 0; border-radius: 10px;
  }
  button:disabled { opacity: .5; }
  pre {
    white-space: pre-wrap; background: #191c23; padding: 10px;
    border-radius: 8px; font-size: 12px; margin-top: 14px; color: #c9cddb;
  }
</style>
</head>
<body>
<h1>Push diagnostics</h1>
<p class="sub">Open this <b>from the Home Screen icon</b>, not a Safari tab.</p>
<div id="out"></div>
<button id="go">Request permission &amp; subscribe</button>
<pre id="log">ready</pre>

<script>
const out = document.getElementById('out');
const logEl = document.getElementById('log');
const lines = [];
const log = (s) => { lines.push(s); logEl.textContent = lines.join('\n'); };

function row(k, v, cls) {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<div class="k"></div><div class="v ${cls ?? ''}"></div>`;
  d.children[0].textContent = k;
  d.children[1].textContent = String(v);
  out.appendChild(d);
}
const yn = (b) => (b ? 'ok' : 'no');

const isStandalone = window.navigator.standalone === true
  || window.matchMedia('(display-mode: standalone)').matches;

/**
 * This app's VAPID public key, as OneSignal's own web SDK fetches it from
 * https://api.onesignal.com/sync/<app_id>/web. iOS rejects
 * pushManager.subscribe() without an applicationServerKey, so subscribing with
 * the real key is the only way to tell "Apple refuses this origin" apart from
 * "OneSignal's SDK never asked properly".
 */
const VAPID = 'BNuYDQcpxHlf2KhfbFwFOeRtgIS72KS-V8WntrzEZciCPQ7I_0O9oG-IHtX80EdPWhP3NjQlfJ1I34tWkc4oV1c';

const b64ToBytes = (s) => {
  const pad = '='.repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
};

/**
 * Everything Apple requires before a Home Screen web app can hold a push
 * subscription. Any single "no" below is sufficient on its own to produce the
 * symptom "permission granted, token empty" — which is why they are listed
 * separately rather than rolled into one verdict.
 */
async function render() {
  out.innerHTML = '';
  row('origin', location.origin);
  row('standalone (installed)', isStandalone, yn(isStandalone));
  row('secure context', window.isSecureContext, yn(window.isSecureContext));
  row('Notification API', 'Notification' in window, yn('Notification' in window));
  row('Notification.permission',
      'Notification' in window ? Notification.permission : 'n/a',
      'Notification' in window && Notification.permission === 'granted' ? 'ok' : 'warn');
  row('PushManager API', 'PushManager' in window, yn('PushManager' in window));
  row('serviceWorker API', 'serviceWorker' in navigator, yn('serviceWorker' in navigator));

  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    row('SW registrations', regs.length, yn(regs.length > 0));
    for (const r of regs) {
      row('  scope', r.scope);
      row('  state', r.active ? 'active' : r.installing ? 'installing' : r.waiting ? 'waiting' : '?',
          r.active ? 'ok' : 'warn');
      let sub = null;
      try { sub = await r.pushManager.getSubscription(); } catch (e) { row('  getSubscription threw', e.message, 'no'); }
      row('  push endpoint', sub ? sub.endpoint : 'NONE', sub ? 'ok' : 'no');
    }
  }

  const os = window.OneSignal;
  if (os && os.User && os.User.PushSubscription) {
    const p = os.User.PushSubscription;
    row('OneSignal sub id', p.id ?? 'none', p.id ? 'ok' : 'no');
    row('OneSignal optedIn', p.optedIn, yn(p.optedIn));
    row('OneSignal token', p.token ? p.token.slice(0, 44) + '…' : 'EMPTY', p.token ? 'ok' : 'no');
  } else {
    row('OneSignal SDK', 'not loaded on this page', 'warn');
  }
}

/**
 * Subscribes with the raw Web Push API and no OneSignal involved. If this
 * produces an endpoint, the browser and the origin are fine and the fault is in
 * the OneSignal layer; if it fails, the error is Apple's own and says why.
 */
document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  try {
    if (!isStandalone) log('WARNING: not standalone — iOS will not subscribe here.');

    log('requesting permission…');
    const perm = await Notification.requestPermission();
    log('permission = ' + perm);
    if (perm !== 'granted') { log('STOP: permission not granted.'); return; }

    log('registering /OneSignalSDKWorker.js …');
    const reg = await navigator.serviceWorker.register('/OneSignalSDKWorker.js', { scope: '/' });
    await navigator.serviceWorker.ready;
    log('SW registered, scope=' + reg.scope);

    let sub = await reg.pushManager.getSubscription();
    if (sub) {
      log('dropping the existing subscription first…');
      await sub.unsubscribe();
    }
    log('subscribing with OneSignal’s VAPID key…');
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToBytes(VAPID),
    });
    log('ENDPOINT: ' + sub.endpoint);
  } catch (e) {
    log('FAILED: ' + e.name + ': ' + e.message);
  } finally {
    btn.disabled = false;
    await render();
  }
};

render();
</script>
</body>
</html>
