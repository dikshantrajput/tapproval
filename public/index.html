<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tapproval — approve your coding agent from your phone</title>
<meta name="description" content="Approve or deny your coding agent's permission prompts from your phone.">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="tapproval">
<meta property="og:description" content="Approve or deny your coding agent's permission prompts from your phone.">
<meta property="og:image" content="/icon-512.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<!-- No manifest link here on purpose: "Add to Home Screen" from the landing page
     would install a shortcut to marketing. The manifest lives on /app. -->
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --inset: #f0f2f6;
    --line: #d8dbe3;
    --fg: #14161c;
    --fg-dim: #565c6b;
    --accent: #2f49c9;
    --accent-fg: #ffffff;
    --shadow: 0 1px 2px rgba(16, 20, 30, .06), 0 8px 24px -12px rgba(16, 20, 30, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --surface: #191c23;
      --inset: #0c0e13;
      --line: #282d38;
      --fg: #eef0f5;
      --fg-dim: #9aa2b1;
      --accent: #7d8ff5;
      --accent-fg: #0c0e13;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -16px rgba(0, 0, 0, .7);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 46rem;
    margin: 0 auto;
    padding: clamp(3rem, 10vw, 6rem) 1.25rem 5rem;
  }

  .mark {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .mark img { width: 2rem; height: 2rem; border-radius: .5rem; }

  h1 {
    margin: 2.5rem 0 0;
    font-size: clamp(2rem, 7vw, 3rem);
    line-height: 1.1;
    letter-spacing: -.03em;
    font-weight: 650;
  }

  .sub {
    margin: 1rem 0 0;
    font-size: clamp(1.05rem, 3vw, 1.2rem);
    color: var(--fg-dim);
    max-width: 34rem;
  }

  /* Command */
  .cmd {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin: 2rem 0 0;
    padding: .85rem 1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: .85rem;
    box-shadow: var(--shadow);
  }
  .cmd code {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    white-space: nowrap;
    font: 500 .95rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .cmd code .dim { color: var(--fg-dim); }
  .cmd button {
    flex: none;
    padding: .45rem .75rem;
    font: 500 .8rem/1 inherit;
    color: var(--fg-dim);
    background: var(--inset);
    border: 1px solid var(--line);
    border-radius: .55rem;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .cmd button:hover { color: var(--fg); border-color: var(--fg-dim); }
  .cmd button[data-copied] { color: var(--accent); border-color: var(--accent); }

  /* Video */
  .demo {
    margin: 2.5rem 0 0;
    aspect-ratio: 16 / 9;
    background: var(--inset);
    border: 1px solid var(--line);
    border-radius: 1rem;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .demo iframe { display: block; width: 100%; height: 100%; border: 0; }

  .caption {
    margin: .85rem 0 0;
    font-size: .875rem;
    color: var(--fg-dim);
  }

  /* Footer links */
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    margin: 3rem 0 0;
    padding-top: 1.75rem;
    border-top: 1px solid var(--line);
    font-size: .9rem;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .links a { color: var(--fg-dim); }
  .links a:hover { color: var(--fg); }
</style>
</head>
<body>
<main>
  <span class="mark"><img src="/icon-192.png" alt="">tapproval</span>

  <h1>Approve your coding agent<br>from your phone.</h1>

  <p class="sub">
    Your agent hits a permission prompt. Your phone buzzes. You tap allow or deny
    and it keeps working — you don't have to be at the keyboard.
  </p>

  <div class="cmd">
    <code id="cmd">npx tapproval setup<span class="dim"></span></code>
    <button type="button" id="copy" aria-label="Copy command">Copy</button>
  </div>

  <div class="demo">
    <iframe
      src="https://www.youtube-nocookie.com/embed/wWkMDrM71Hg?rel=0&amp;modestbranding=1"
      title="tapproval demo"
      loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>

  <p class="caption">
    Already paired? <a href="/app">Open the app</a>.
  </p>

  <nav class="links">
    <a href="/app">App</a>
    <a href="https://github.com/dikshantrajput/tapproval">GitHub</a>
    <a href="https://www.npmjs.com/package/tapproval">npm</a>
    <a href="https://github.com/dikshantrajput/tapproval#readme">Docs</a>
  </nav>
</main>

<script>
  /* Installs made before the app moved to /app have "/" frozen as their
     start_url — on iOS permanently, since a Home Screen icon keeps whatever
     start_url it was installed with. Send those launches on to the app so a
     paired phone never lands on marketing. Only when running standalone: a
     normal browser visit here is someone reading the pitch, even if this
     browser happens to hold credentials. */
  var standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (standalone) location.replace('/app');

  var btn = document.getElementById('copy');
  btn.addEventListener('click', function () {
    navigator.clipboard.writeText('npx tapproval setup').then(function () {
      btn.textContent = 'Copied';
      btn.setAttribute('data-copied', '');
      setTimeout(function () {
        btn.textContent = 'Copy';
        btn.removeAttribute('data-copied');
      }, 1600);
    });
  });
</script>
</body>
</html>
